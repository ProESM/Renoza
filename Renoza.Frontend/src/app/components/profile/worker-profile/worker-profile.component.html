<div class="profile-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Профиль работника</mat-card-title>
      <mat-card-subtitle>Управление профилем исполнителя</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <!-- Специализация -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Специализация</mat-label>
          <input matInput formControlName="specialization" placeholder="Например: Электрик, Сантехник">
          <mat-error *ngIf="profileForm.get('specialization')?.hasError('maxlength')">
            Максимум 256 символов
          </mat-error>
        </mat-form-field>

        <!-- Размер команды -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Размер команды</mat-label>
          <input matInput type="number" formControlName="teamSize" placeholder="Количество человек">
          <mat-error *ngIf="profileForm.get('teamSize')?.hasError('min')">
            Минимум 1 человек
          </mat-error>
          <mat-error *ngIf="profileForm.get('teamSize')?.hasError('max')">
            Максимум 1000 человек
          </mat-error>
        </mat-form-field>

        <!-- Дата начала профессиональной деятельности -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Дата начала профессиональной деятельности</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="professionalStartDate">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <!-- Рейтинг -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Рейтинг</mat-label>
          <input matInput type="number" step="0.1" formControlName="rating" placeholder="От 0 до 5">
          <mat-error *ngIf="profileForm.get('rating')?.hasError('min')">
            Минимум 0
          </mat-error>
          <mat-error *ngIf="profileForm.get('rating')?.hasError('max')">
            Максимум 5
          </mat-error>
        </mat-form-field>

        <!-- Сертификаты -->
        <div class="certifications-section">
          <h3>Сертификаты и лицензии</h3>

          <div class="certification-input">
            <mat-form-field appearance="outline" class="cert-input">
              <mat-label>Добавить сертификат</mat-label>
              <input matInput [(ngModel)]="newCertification" [ngModelOptions]="{standalone: true}"
                     (keyup.enter)="addCertification()" placeholder="Название сертификата">
            </mat-form-field>
            <button mat-raised-button type="button" (click)="addCertification()"
                    [disabled]="!newCertification.trim()">
              <mat-icon>add</mat-icon>
              Добавить
            </button>
          </div>

          <mat-chip-set *ngIf="certifications.length > 0" class="certifications-chips">
            <mat-chip *ngFor="let cert of certifications" [removable]="true"
                      (removed)="removeCertification(cert)">
              {{ cert }}
              <mat-icon matChipRemove>cancel</mat-icon>
            </mat-chip>
          </mat-chip-set>
        </div>

        <!-- Кнопки действий -->
        <div class="actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="loading || profileForm.invalid">
            <mat-icon>save</mat-icon>
            {{ profile ? 'Обновить профиль' : 'Создать профиль' }}
          </button>

          <button mat-raised-button type="button" *ngIf="profile"
                  [color]="profile.isAvailable ? 'accent' : 'warn'"
                  (click)="toggleAvailability()" [disabled]="loading">
            <mat-icon>{{ profile.isAvailable ? 'check_circle' : 'cancel' }}</mat-icon>
            {{ profile.isAvailable ? 'Доступен для работы' : 'Недоступен' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

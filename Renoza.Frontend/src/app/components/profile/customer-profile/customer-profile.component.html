<div class="profile-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Профиль заказчика</mat-card-title>
      <mat-card-subtitle>Управление профилем заказчика</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <!-- Название компании -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Название компании</mat-label>
          <input matInput formControlName="companyName" placeholder="ООО 'Название'">
          <mat-icon matPrefix>business</mat-icon>
          <mat-error *ngIf="profileForm.get('companyName')?.hasError('maxlength')">
            Максимум 256 символов
          </mat-error>
        </mat-form-field>

        <!-- ИНН компании -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>ИНН компании</mat-label>
          <input matInput formControlName="taxId" placeholder="1234567890">
          <mat-icon matPrefix>description</mat-icon>
          <mat-error *ngIf="profileForm.get('taxId')?.hasError('maxlength')">
            Максимум 50 символов
          </mat-error>
        </mat-form-field>

        <!-- Адрес для выставления счетов -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Адрес для выставления счетов</mat-label>
          <input matInput formControlName="billingAddress" placeholder="г. Москва, ул. Примерная, д. 1">
          <mat-icon matPrefix>location_on</mat-icon>
          <mat-error *ngIf="profileForm.get('billingAddress')?.hasError('maxlength')">
            Максимум 500 символов
          </mat-error>
        </mat-form-field>

        <!-- Кредитный лимит -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Кредитный лимит</mat-label>
          <input matInput type="number" formControlName="creditLimit" placeholder="100000">
          <mat-icon matPrefix>account_balance</mat-icon>
          <mat-error *ngIf="profileForm.get('creditLimit')?.hasError('min')">
            Минимум 0
          </mat-error>
        </mat-form-field>

        <!-- Кнопки действий -->
        <div class="actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="loading || profileForm.invalid">
            <mat-icon>save</mat-icon>
            {{ profile ? 'Обновить профиль' : 'Создать профиль' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

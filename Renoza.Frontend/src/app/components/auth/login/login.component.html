<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Вход в систему</mat-card-title>
      <mat-card-subtitle>Renoza</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Имя пользователя или Email</mat-label>
          <input matInput formControlName="username" required>
          <mat-icon matSuffix>person</mat-icon>
          @if (f['username'].hasError('required')) {
            <mat-error>Имя пользователя обязательно</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Пароль</mat-label>
          <input matInput
                 [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password"
                 required>
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          @if (f['password'].hasError('required')) {
            <mat-error>Пароль обязателен</mat-error>
          }
        </mat-form-field>

        @if (error) {
          <div class="error-message">
            <mat-icon>error</mat-icon>
            <span>{{ error }}</span>
          </div>
        }

        <div class="actions">
          <button mat-raised-button
                  color="primary"
                  type="submit"
                  [disabled]="loading || loginForm.invalid"
                  class="login-button">
            @if (loading) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              <span>Войти</span>
            }
          </button>

          <a mat-button routerLink="/auth/reset-password" class="forgot-password">
            Забыли пароль?
          </a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

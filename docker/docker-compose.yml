    # healthcheck:
      # test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      # interval: 10s
      # timeout: 5s
      # retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: renoza-redis
    command: redis-server --appendonly yes
    environment:
      - TZ=Europe/Moscow
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - renoza-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: renoza-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin}
      - TZ=Europe/Moscow
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - renoza-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: Renoza.Backend/Dockerfile
    container_name: renoza-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      # - ConnectionStrings__Renoza=Host=postgres;Port=5432;Database=${POSTGRES_DB:-renoza};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      # Используйте внешнюю БД PostgreSQL
      - ConnectionStrings__Renoza=Host=${POSTGRES_HOST:-postgres};Port=5432;Database=${POSTGRES_DB:-renoza};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Redis__ConnectionString=redis:6379
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:-admin}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-admin}
      - TZ=Europe/Moscow
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - renoza-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web Application
  frontend:
    build:
      context: ../Renoza.Frontend
      dockerfile: Dockerfile
    container_name: renoza-frontend
    environment:
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    networks:
      - renoza-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  renoza-network:
    driver: bridge
    name: renoza-network

volumes:
  postgres_data:
    name: renoza-postgres-data
  redis_data:
    name: renoza-redis-data
  rabbitmq_data:
    name: renoza-rabbitmq-data
